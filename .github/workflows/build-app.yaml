# Reusable: build one add-on for every architecture in its config.yaml and,
# when publishing, push the per-arch images and the multi-arch manifest to
# GHCR under the `image` name from config.yaml, tagged with its `version`.
#
# A version is published ONCE. If its tag already exists, this builds and
# tests but pushes nothing: a tag that moved would give two hosts on the
# "same" version different images, and Home Assistant never offers the newer
# one, because it updates only when the version string changes.
name: Build app

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    # Reads the repository and asks the registry anonymously; without this the
    # job would inherit the caller's packages: write and id-token: write.
    permissions:
      contents: read
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
      publish: ${{ steps.published.outputs.publish }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@58bff37c8947f690ace498be413a9b78d6f30f93 # master 2026-09
        with:
          path: "./${{ inputs.app }}"

      # The info action emits every value JSON-encoded (yq -o=json). Decode it
      # with jq from the environment instead of pasting ${{ }} into the
      # script, where a $(...) or a backtick in config.yaml would run.
      - name: Normalize app information
        id: normalize
        env:
          INFO_IMAGE: ${{ steps.info.outputs.image }}
          INFO_VERSION: ${{ steps.info.outputs.version }}
          INFO_NAME: ${{ steps.info.outputs.name }}
          INFO_DESCRIPTION: ${{ steps.info.outputs.description }}
          INFO_URL: ${{ steps.info.outputs.url }}
        run: |
          dec() { jq -r 'if . == null then "" else tostring end' <<< "$1"; }
          image=$(dec "$INFO_IMAGE")
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          echo "version=$(dec "$INFO_VERSION")" >> "$GITHUB_OUTPUT"
          echo "name=$(dec "$INFO_NAME")" >> "$GITHUB_OUTPUT"
          echo "description=$(dec "$INFO_DESCRIPTION")" >> "$GITHUB_OUTPUT"
          url=$(dec "$INFO_URL")
          if [[ -n "$url" ]]; then
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi

      # Fails closed: a registry that cannot be asked is a failed job, never
      # "not published, go ahead" - that is how a tag gets overwritten.
      - name: Publish only a version that is not published yet
        id: published
        env:
          PUBLISH: ${{ inputs.publish }}
          IMAGE: ${{ steps.normalize.outputs.registry_prefix }}/${{ steps.normalize.outputs.image_name }}
          VERSION: ${{ steps.normalize.outputs.version }}
        run: |
          if [[ "$PUBLISH" != "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          rc=0; bash .github/scripts/tag-published.sh "$IMAGE" "$VERSION" || rc=$?
          case "$rc" in
            0) echo "::notice::$IMAGE:$VERSION is already published; published tags never change, so nothing is pushed"
               echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "$IMAGE:$VERSION is new; publishing"
               echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::could not ask the registry whether $IMAGE:$VERSION exists"; exit 1 ;;
          esac

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ inputs.app }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          version: ${{ needs.prepare.outputs.version }}

  # The gate that makes automerge safe: the image built from this commit runs
  # UNDER ITS APPARMOR PROFILE in enforce mode, reads the runner's real journal
  # and pushes to a real Loki. A dependency bump that needs a path the profile
  # does not grant, or that breaks the journal reader, fails here. See
  # .github/scripts/e2e.sh for what exactly is asserted.
  test:
    name: End-to-end under AppArmor
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      loki:
        image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
        ports:
          - 3100:3100
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A variant built FROM the published base (alloy-host) is tested against
      # THIS commit's base, not the published one: the gate then proves the
      # combination that exists after the base publishes and Renovate bumps
      # the variant's pin - otherwise a base fix could never pass the gate
      # here, since the variant would still be running the old generator.
      # The publish job builds the variant from its Dockerfile as committed,
      # i.e. from the pinned published base; the bump PR re-gates that.
      - name: Build the amd64 image on the runner
        env:
          APP: ${{ inputs.app }}
        run: |
          if [[ "$APP" != "alloy" && -d alloy ]]; then
            docker buildx build --load -t base-under-test ./alloy
            docker buildx build --load --build-arg BASE_IMAGE=base-under-test -t addon-under-test "./$APP"
          else
            docker buildx build --load -t addon-under-test "./$APP"
          fi

      - name: Wait for Loki
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3100/ready && exit 0
            sleep 3
          done
          echo "Loki never became ready"; exit 1

      - name: Run the end-to-end test
        env:
          APP: ${{ inputs.app }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq apparmor-utils python3-systemd >/dev/null
          bash .github/scripts/e2e.sh addon-under-test \
            http://host.docker.internal:3100/loki/api/v1/push \
            http://localhost:3100

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build, test]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
